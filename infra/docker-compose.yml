services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dgrandeur
      POSTGRES_PASSWORD: dgrandeur
      POSTGRES_DB: dgrandeur
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://dgrandeur:dgrandeur@postgres:5432/dgrandeur
      REDIS_URL: redis://redis:6379
    ports:
      - "4000:4000"
    depends_on:
      - postgres
      - redis

volumes:
  postgres-data:
  minio-data:
