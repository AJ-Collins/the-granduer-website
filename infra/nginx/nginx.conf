events {}

http {
  upstream web {
    server web:3000;
  }

  upstream admin {
    server admin:3001;
  }

  upstream cms {
    server cms:3002;
  }

  server {
    listen 80;
    server_name dgrandeur.com;

    location / {
      proxy_pass http://web;
    }
  }

  server {
    listen 80;
    server_name admin.dgrandeur.com;

    location / {
      proxy_pass http://admin;
    }
  }

  server {
    listen 80;
    server_name cms.dgrandeur.com;

    location / {
      proxy_pass http://cms;
    }
  }
}
